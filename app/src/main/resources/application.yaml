spring:
  application:
    name: app

  datasource:
    url: jdbc:h2:mem:fleetdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: mappings,health

mqtt:
  broker: tcp://fleet-mqtt:1883
  topic: robot/+/status
  client-id: fleet-service